name: Git identity

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: identity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # The default pull_request checkout is GitHub's synthetic merge
          # commit. Check the contributor head instead, otherwise that merge
          # commit's GitHub-generated identity would reject valid PRs.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject unauthorized identities and AI attributions
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              git fetch --no-tags origin "${{ github.base_ref }}"
              base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
              range="$base..HEAD"
              ;;
            push)
              before="${{ github.event.before }}"
              if [[ "$before" =~ ^0+$ ]]; then
                git fetch --no-tags origin main
                base="$(git merge-base origin/main HEAD)"
                range="$base..HEAD"
              else
                range="$before..${{ github.sha }}"
              fi
              ;;
            *)
              range="HEAD"
              ;;
          esac
          violations="$(git log --format='%H%x09%an%x09%ae%x09%cn%x09%ce' "$range" | awk -F '\t' '
            function author_ok(n, e) {
              return n == "Vitoronzo De Francesco" \
                && (e == "renzodefrancesco@gmail.com" || e == "v.defrancesco@reply.it")
            }
            function committer_ok(n, e) {
              return author_ok(n, e) || (n == "GitHub" && e == "noreply@github.com")
            }
            !author_ok($2, $3) || !committer_ok($4, $5) { print $1 }
          ')"
          if [[ -n "$violations" ]]; then
            echo "Commits must be authored by Vitoronzo De Francesco <renzodefrancesco@gmail.com>:" >&2
            echo "$violations" >&2
            exit 1
          fi
          while IFS= read -r commit; do
            [[ -n "$commit" ]] || continue
            footers="$(git show -s --format=%B "$commit" | git interpret-trailers --parse)"
            if [[ -n "$footers" ]]; then
              echo "Commit $commit contains prohibited trailing footers:" >&2
              echo "$footers" >&2
              exit 1
            fi
          done < <(git rev-list "$range")
